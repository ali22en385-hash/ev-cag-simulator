<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EV Cabin &amp; CAN-Bus Monitor</title>
<style>
:root{--pg:#dfe5ee;--fr:#1B2230;--scr:#EEF2F7;--card:#fff;--ln:#DDE3EC;--tx:#1B3A5C;--mu:#4A5568;--teal:#1E8A80;--navy:#1B3A5C;--amb:#D4900A;--red:#C53030;--rust:#C0561F;--slate:#4A5568;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#0b111b;--fr:#05080d;--scr:#121a27;--card:#1a2435;--ln:#2a3850;--tx:#dbe6f5;--mu:#9fb0c7;--navy:#2c5a8c}}
:root[data-theme="dark"]{--pg:#0b111b;--fr:#05080d;--scr:#121a27;--card:#1a2435;--ln:#2a3850;--tx:#dbe6f5;--mu:#9fb0c7;--navy:#2c5a8c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--pg);font-family:"Segoe UI",Cairo,Tahoma,Arial,sans-serif;color:var(--tx)}
.phone{max-width:400px;margin:0 auto}
.scr{background:var(--scr);padding:16px 12px 18px;min-height:100vh}
@media (min-width:520px){.phone{background:var(--fr);padding:14px;border-radius:46px;margin:16px auto}.scr{border-radius:32px;min-height:0}}
h1{font-size:16px;margin:4px 8px 2px}.sub{font-size:12px;color:var(--mu);margin:0 8px 10px}
.two{display:flex}.two button{flex:1;border:0;color:#fff;font:700 13px inherit;font-family:inherit;padding:14px 6px;cursor:pointer}
#bStart{background:var(--teal);border-radius:14px 0 0 14px}#bConn{background:var(--navy);border-radius:0 14px 14px 0}
[dir="rtl"] #bStart{border-radius:0 14px 14px 0}[dir="rtl"] #bConn{border-radius:14px 0 0 14px}
#st{margin:10px 6px;border-radius:14px;padding:16px 18px;color:#fff;transition:background .3s}
#st small{font-size:12px;font-weight:700;opacity:.85;letter-spacing:.5px}#st b{display:block;font-size:22px;margin:2px 0 14px}#st span{font-size:12px}
#st.s3{animation:pl 1.1s infinite}@keyframes pl{50%{box-shadow:0 0 0 6px rgba(197,48,48,.35)}}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 6px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px 12px}
.c small{display:block;font-size:11px;font-weight:700;color:var(--mu)}
.c b{display:block;margin-top:10px;font:700 16px ui-monospace,Consolas,Menlo,monospace;direction:ltr;text-align:start;min-height:20px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%}
.w{margin:8px 6px;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px}
.w h2{font-size:13px;margin:0 0 8px}canvas{width:100%;height:110px;display:block}
.lr{display:flex;justify-content:space-between;padding:7px 2px;font-size:12px}.lr i{font:normal 11px ui-monospace,Consolas,monospace;color:var(--mu);direction:ltr}.lr b{flex:0 0 46%}
#bSet{display:block;width:calc(100% - 12px);margin:8px 6px 0;border:0;border-radius:14px;background:var(--slate);color:#fff;font:700 13px inherit;font-family:inherit;padding:20px 8px;cursor:pointer}
#set{display:none;margin:8px 6px 0}#set.open{display:block}
.r{display:flex;align-items:center;gap:8px;font-size:12px;margin:6px 0}.r label{flex:0 0 88px}.r input[type=range]{flex:1;min-width:0}.r output{flex:0 0 66px;text-align:end;direction:ltr;font-weight:700}
.b{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.b button,.sm{font:inherit;font-size:12px;border:1px solid var(--ln);background:var(--scr);color:var(--tx);border-radius:8px;padding:6px 10px;cursor:pointer}
.k{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;margin:8px 0}
#ws{flex:1;min-width:0;font:12px ui-monospace,Consolas,monospace;direction:ltr;border:1px solid var(--ln);border-radius:8px;padding:6px;background:var(--scr);color:var(--tx)}
#note{font-size:11px;color:var(--mu);margin:4px 0 0}
</style>
</head>
<body>
<div class="phone"><div class="scr" id="scr">
<h1 id="tI"></h1><p class="sub" id="sI"></p>
<div class="two"><button id="bStart"></button><button id="bConn"></button></div>
<div id="st" class="s0"><small id="stL"></small><b id="stN"></b><span id="stM"></span></div>
<div class="g">
 <div class="c"><small data-k="soc"></small><b id="vSoc"></b></div>
 <div class="c"><small data-k="tb"></small><b id="vTb"></b></div>
 <div class="c"><small data-k="tm"></small><b id="vTm"></b></div>
 <div class="c"><small data-k="f"></small><b id="vF"></b></div>
 <div class="c"><small>CO2</small><b id="vCo"></b></div>
 <div class="c"><small data-k="hu"></small><b id="vHu"></b></div>
</div>
<div class="w"><h2 data-k="trend"></h2><canvas id="cv" width="640" height="220"></canvas></div>
<div class="w"><h2 data-k="log"></h2><div id="lg"></div></div>
<button id="bSet"></button>
<div id="set" class="w">
 <h2 data-k="scen"></h2>
 <div class="b"><button data-p="0"></button><button data-p="1"></button><button data-p="2"></button><button data-p="3"></button></div>
 <div id="sl"></div>
 <div class="k"><label><input type="checkbox" id="ckF"> <span data-k="dtc"></span></label><label><input type="checkbox" id="ckQ" checked> <span data-k="q8"></span></label><label><input type="checkbox" id="ckH" checked> <span data-k="hy"></span></label><label><input type="checkbox" id="ckS"> <span data-k="snd"></span></label></div>
 <h2 data-k="thr"></h2><div id="th"></div>
 <h2 data-k="con"></h2>
 <div class="r"><input id="ws" value="wss://192.168.4.1:81"><button class="sm" id="bWs"></button></div>
 <p id="note"></p>
 <div class="b"><button id="bCsv"></button><button id="bLang"></button></div>
</div>
</div></div>
<script>
(function(){
var D={en:{t:"EV Cabin & CAN-Bus Monitor",s:"Integrated health & air-quality dashboard",go:"Start Simulation",stop:"Stop Simulation",cn:"Connect to Device",stt:"STATUS",
S:["Normal","Cabin Air Alert","Vehicle Fault Alert","Critical"],M:["All systems healthy","Air quality alert — ventilation advised","Vehicle fault — maintenance advised","Air alert and vehicle fault together"],
soc:"SOC",tb:"Batt Temp",tm:"Motor Temp",f:"Fault",hu:"Humidity",trend:"Recent trend — CO2 & Batt Temp",log:"Alert log",set:"⚙  Settings & connection",
scen:"Scenario & inputs",p:["Normal","Air alert","Vehicle fault","Critical"],dtc:"DTC fault flag",q8:"8-bit quantization",hy:"Confirm (hysteresis)",snd:"Sound",thr:"Thresholds",con:"Connection",
tc:"CO2 limit",tbl:"Batt limit",tml:"Motor limit",cc:"Connect",csv:"Copy log as CSV",lang:"العربية",
n0:"Enter the ESP32 WebSocket URL. Use wss:// when this page is opened over https.",n1:"Connecting…",n2:"Connected — showing live data",n3:"Connection failed — still in demo mode",n4:"CSV copied",n5:"Copy not available"},
ar:{t:"مراقب المقصورة وCAN-Bus",s:"لوحة متكاملة للصحة وجودة الهواء",go:"بدء المحاكاة",stop:"إيقاف المحاكاة",cn:"الاتصال بالجهاز",stt:"الحالة",
S:["طبيعي","تنبيه هواء","عطل سيارة","حرج"],M:["النظام سليم","تنبيه جودة هواء — يُنصح بالتهوية","عطل بالسيارة — يُنصح بالصيانة","تنبيه هواء وعطل سيارة معًا"],
soc:"نسبة الشحن",tb:"حرارة البطارية",tm:"حرارة المحرك",f:"العطل",hu:"الرطوبة",trend:"الاتجاه الأخير — CO2 وحرارة البطارية",log:"سجل التنبيهات",set:"⚙  الإعدادات والاتصال",
scen:"السيناريو والمدخلات",p:["طبيعي","تنبيه هواء","عطل سيارة","حرج"],dtc:"علم عطل DTC",q8:"تكميم 8-بت",hy:"تأكيد (hysteresis)",snd:"صوت",thr:"العتبات",con:"الاتصال",
tc:"حد CO2",tbl:"حد البطارية",tml:"حد المحرك",cc:"اتصال",csv:"نسخ السجل بصيغة CSV",lang:"English",
n0:"أدخل عنوان WebSocket لـ ESP32، واستخدم wss:// عند فتح الصفحة عبر https.",n1:"جارٍ الاتصال…",n2:"متصل — تُعرض بيانات حية",n3:"فشل الاتصال — ما زال وضع العرض التجريبي",n4:"تم نسخ CSV",n5:"النسخ غير متاح"}};
var C=["#1E8A80","#D4900A","#C0561F","#C53030"],NAVY="#1B3A5C";
var lang="en",V={soc:62,tb:54.2,tm:41,co2:1830,hu:58},F=1,sim=false,tk=0,LIM={c:1500,b:50,m:90},ws=null,note=0;
var R={soc:[0,100,1,"%","soc"],tb:[20,70,.5,"°C","tb"],tm:[20,120,.5,"°C","tm"],co2:[400,3000,10," ppm","CO2"],hu:[20,90,1,"%","hu"]};
var NR={tb:[20,70],tm:[20,120],co2:[400,3000]};
var PRE=[{soc:80,tb:34,tm:42,co2:650,hu:48,f:0},{soc:70,tb:36,tm:44,co2:2200,hu:65,f:0},{soc:55,tb:58,tm:70,co2:800,hu:50,f:1},{soc:62,tb:54.2,tm:41,co2:1830,hu:58,f:1}];
var hist=[],log=[],com=0,pend=-1,cnt=0;
function $(i){return document.getElementById(i)}
function T(){return D[lang]}
function qz(x,k){var a=NR[k][0],b=NR[k][1];return Math.round((x-a)/(b-a)*255)/255*(b-a)+a}
function view(){var o={};for(var k in V)o[k]=V[k];if($("ckQ").checked){["tb","tm","co2"].forEach(function(k){o[k]=qz(V[k],k)})}return o}
function cls(v){var fa=F==1||v.tb>LIM.b||v.tm>LIM.m,ai=v.co2>LIM.c;return fa&&ai?3:fa?2:ai?1:0}
function setS(s){if(s!==com){com=s;var d=new Date();log.unshift({s:s,t:d.toLocaleTimeString([], {hour12:false})});log=log.slice(0,8)}}
function build(){
 var h="";for(var k in R){var r=R[k];h+='<div class="r"><label data-k="'+r[4]+'">'+(k=="co2"?"CO2":"")+'</label><input type="range" id="r_'+k+'" min="'+r[0]+'" max="'+r[1]+'" step="'+r[2]+'"><output id="o_'+k+'"></output></div>'}
 $("sl").innerHTML=h;
 for(var k in R)(function(k){$("r_"+k).addEventListener("input",function(e){V[k]=+e.target.value;sim=false;upd();run(true)})})(k);
 var th=[["c","tc",800,3000,50," ppm"],["b","tbl",40,70,1,"°C"],["m","tml",60,120,1,"°C"]],t="";
 th.forEach(function(a){t+='<div class="r"><label data-k="'+a[1]+'"></label><input type="range" id="t_'+a[0]+'" min="'+a[2]+'" max="'+a[3]+'" step="'+a[4]+'" value="'+LIM[a[0]]+'"><output id="lt_'+a[0]+'">'+LIM[a[0]]+a[5]+'</output></div>'});
 $("th").innerHTML=t;
 th.forEach(function(a){$("t_"+a[0]).addEventListener("input",function(e){LIM[a[0]]=+e.target.value;$("lt_"+a[0]).textContent=e.target.value+a[5];run(true)})});
}
function txt(){var L=T();document.documentElement.lang=lang;var rt=lang=="ar";document.documentElement.dir=rt?"rtl":"ltr";
 $("tI").textContent=L.t;$("sI").textContent=L.s;$("bStart").textContent=sim?L.stop:L.go;$("bConn").textContent=L.cn;$("stL").textContent=L.stt;$("bSet").textContent=L.set;
 document.querySelectorAll("[data-k]").forEach(function(e){var k=e.getAttribute("data-k");if(L[k]!==undefined&&k!="p")e.textContent=L[k]});
 document.querySelectorAll("[data-p]").forEach(function(e){e.textContent=L.p[+e.getAttribute("data-p")]});
 $("bWs").textContent=L.cc;$("bCsv").textContent=L.csv;$("bLang").textContent=L.lang;$("note").textContent=L["n"+note]}
function upd(){for(var k in R){$("r_"+k).value=V[k];$("o_"+k).textContent=(+V[k]).toFixed(R[k][2]<1?1:0)+R[k][3]}$("ckF").checked=!!F}
function draw(){var L=T(),s=com,st=$("st");st.style.background=C[s];st.className="s"+s;$("stN").textContent=L.S[s];$("stM").textContent=L.M[s];
 $("vSoc").textContent=Math.round(V.soc)+" %";
 var tb=$("vTb");tb.textContent=V.tb.toFixed(1)+" °C";tb.style.color=V.tb>LIM.b?C[3]:NAVY;
 $("vTm").textContent=V.tm.toFixed(1)+" °C";$("vTm").style.color=V.tm>LIM.m?C[3]:NAVY;
 $("vF").innerHTML='<span class="dot" style="background:'+(F?C[3]:C[0])+'"></span>';
 var co=$("vCo");co.textContent=Math.round(V.co2)+" ppm";co.style.color=V.co2>LIM.c?C[1]:NAVY;
 $("vHu").textContent=Math.round(V.hu)+" %";
 var cs=getComputedStyle(document.documentElement).getPropertyValue("--tx");
 $("vSoc").style.color=$("vHu").style.color=cs;
 if(V.tm<=LIM.m)$("vTm").style.color=cs;if(V.tb<=LIM.b)tb.style.color=cs;if(V.co2<=LIM.c)co.style.color=cs;
 $("lg").innerHTML=log.slice(0,5).map(function(x){return '<div class="lr"><i>'+x.t+'</i><b style="color:'+C[x.s]+'">'+L.S[x.s]+'</b></div>'}).join("");
 chart()}
function chart(){var cv=$("cv"),g=cv.getContext("2d"),W=cv.width,H=cv.height;g.clearRect(0,0,W,H);var n=hist.length;if(n<2)return;
 var dx=(W-16)/39;function ln(f,col,lo,hi){g.beginPath();g.strokeStyle=col;g.lineWidth=5;g.lineJoin="round";g.lineCap="round";
  hist.forEach(function(h,i){var x=8+(i+40-n)*dx,y=(H-24)*(1-(f(h)-lo)/(hi-lo))+12;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke()}
 ln(function(h){return h.co},"#D4900A",400,3000);ln(function(h){return h.tb},NAVY=="x"?"":"#3b6d9e",20,70)}
function run(instant){var v=view(),c=cls(v);
 if(!$("ckH").checked||instant&&com!==c&&!$("ckH").checked)setS(c);
 if(instant&&$("ckH").checked){pend=c;cnt=0}
 draw()}
function step(){tk++;
 if(sim){var p=tk%90,sm=function(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
  V.co2=550+2300*sm(p/50)-(p>70?2300*sm((p-70)/12):0);V.tb=34+26*sm((p-35)/25)-(p>75?26*sm((p-75)/10):0);V.tm=44+30*sm((p-35)/25);F=(p>52&&p<78)?1:0;V.hu=48+20*sm(p/50);V.soc=Math.max(10,80-p*.4);upd()}
 var c=cls(view());
 if($("ckH").checked){if(c===pend)cnt++;else{pend=c;cnt=1}if(cnt>=2){var o=com;setS(pend);if(pend===3&&o!==3)beep()}}else setS(c);
 hist.push({co:V.co2,tb:V.tb});if(hist.length>40)hist.shift();draw()}
function beep(){if(!$("ckS").checked)return;try{var a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();setTimeout(function(){o.stop();a.close()},250)}catch(e){}}
function connect(){note=1;txt();try{if(ws)ws.close();ws=new WebSocket($("ws").value)}catch(e){note=3;txt();return}
 ws.onopen=function(){sim=false;note=2;txt()};ws.onerror=ws.onclose=function(){if(note!=2){note=3;txt()}};
 ws.onmessage=function(m){try{var d=JSON.parse(m.data);["soc","tb","tm","co2","hu"].forEach(function(k){if(d[k]!=null)V[k]=+d[k]});if(d.f!=null)F=+d.f?1:0;upd()}catch(e){}}}
$("bStart").addEventListener("click",function(){sim=!sim;tk=0;txt()});
$("bConn").addEventListener("click",function(){$("set").className="w open";$("ws").focus()});
$("bSet").addEventListener("click",function(){var s=$("set");s.className=s.className.indexOf("open")<0?"w open":"w"});
$("bWs").addEventListener("click",connect);
$("bLang").addEventListener("click",function(){lang=lang=="en"?"ar":"en";txt();draw()});
$("bCsv").addEventListener("click",function(){var t="time,state\n"+log.map(function(x){return x.t+","+D.en.S[x.s]}).join("\n");
 try{navigator.clipboard.writeText(t).then(function(){note=4;txt()},function(){note=5;txt()})}catch(e){note=5;txt()}});
document.querySelectorAll("[data-p]").forEach(function(b){b.addEventListener("click",function(){var p=PRE[+b.getAttribute("data-p")];sim=false;
 V.soc=p.soc;V.tb=p.tb;V.tm=p.tm;V.co2=p.co2;V.hu=p.hu;F=p.f;upd();txt();setS(cls(view()));pend=com;cnt=2;draw()})});
$("ckF").addEventListener("change",function(e){F=e.target.checked?1:0;run(true)});
["ckQ","ckH"].forEach(function(i){$(i).addEventListener("change",function(){run(true)})});
build();note=0;txt();upd();setS(cls(view()));pend=com;cnt=2;for(var i=0;i<40;i++)hist.push({co:V.co2,tb:V.tb});
(function(){for(var i=0;i<40;i++){var a=i/39*Math.PI*1.7;hist[i]={co:V.co2-350+300*Math.cos(a),tb:V.tb-7+4*Math.cos(a+.6)}}})();
draw();setInterval(step,700);
})();
</script>
</body>
</html>
